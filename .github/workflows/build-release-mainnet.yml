name: Build and Release Mainnet

on:
  workflow_dispatch:

jobs:
  deploy_image:
    runs-on: {group: Atleta-network, labels: [self-hosted, Linux, X64]}

    steps:
    - uses: actions/checkout@v4

    - name: Set up docker buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to docker hub
      run: docker login -u atletanetwork -p ${{ secrets.REGISTRYPASS }} docker.io
      
    - name: Set timestamp variables
      run: |
          TIMESTAMP=$(date +%d%m%y-%H%M%S)
          echo "TIMESTAMP: $TIMESTAMP"

    - name: Build and push docker image
      run: |
          cache_args=()
          for candidate in \
            /opt/runner-hooks/cargo-cache/client.env \
            /opt/runner-cache-hooks/cargo-cache/client.env; do
            if [[ -r "$candidate" ]]; then
              cache_args+=(--secret "id=cargo_cache_env,src=$candidate")
              break
            fi
          done
          docker build "${cache_args[@]}" --build-arg BUILD_FEATURES=mainnet-runtime --tag docker.io/atletanetwork/atleta-node:mainnet-${TIMESTAMP} .
          docker tag docker.io/atletanetwork/atleta-node:mainnet-${TIMESTAMP} docker.io/atletanetwork/atleta-node:mainnet-latest
          docker push docker.io/atletanetwork/atleta-node:mainnet-${TIMESTAMP}
          docker push docker.io/atletanetwork/atleta-node:mainnet-latest
